name: Release Tag Guard

# Fires on every version-tag push and refuses the release if the internal
# building-block ref has drifted from the tag being cut.
#
# Why this exists (D1):
#   python-react-ci.yml and python-react-publish.yml call the internal
#   _python-react-tests.yml suite by a HARDCODED full path pinned to a tag:
#
#     uses: homelabforge/shared-workflows/.github/workflows/_python-react-tests.yml@vX.Y.Z
#
#   A `./` local path can't be used — it resolves against the CONSUMER repo
#   when called cross-repo and 0s-startup-fails (this is what broke v1.4.0).
#   So the pin must be bumped to the new tag on EVERY release. Forgetting it
#   is silent: vX.Y.(Z+1) would quietly run the OLD vX.Y.Z test suite, with
#   no error and no actionlint warning. This job makes that drift loud.
#
# Caveat: a tag can't be validated before it exists, so this runs AFTER the
# tag is pushed. A red check here means "delete the tag, bump the refs,
# re-tag" — not a silently stale release. For a pre-push gate, mirror this
# check in the local release script before `git tag`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ref-lockstep:
    name: Internal test-suite ref matches tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Assert _python-react-tests.yml refs equal the pushed tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          status=0
          for f in \
            .github/workflows/python-react-ci.yml \
            .github/workflows/python-react-publish.yml; do
            # Anchor on real `uses:` lines so a comment that happens to
            # mention the ref can never satisfy (or spoof) the check.
            refs=$(grep -E '^[[:space:]]*uses:' "$f" \
              | grep -oE '_python-react-tests\.yml@[^[:space:]]+' \
              | sed 's/.*@//' || true)
            if [ -z "$refs" ]; then
              echo "::error file=$f::no _python-react-tests.yml@<ref> call found (expected one pinned to $TAG)"
              status=1
              continue
            fi
            while IFS= read -r ref; do
              if [ "$ref" != "$TAG" ]; then
                echo "::error file=$f::internal test-suite is pinned to @$ref but this tag is $TAG — bump the @ref to $TAG before tagging"
                status=1
              else
                echo "OK  $f -> _python-react-tests.yml@$ref"
              fi
            done <<< "$refs"
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::Release tag guard failed: delete this tag, bump the internal @ref(s) to $TAG, and re-tag."
          fi
          exit $status
