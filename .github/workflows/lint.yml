name: Lint

# Self-check for the shared-workflows repo: actionlint over every reusable
# workflow. Fast and cheap — ~10s. Required before any tag.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  selftest:
    name: selftests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shard verifier
        run: python3 -m unittest discover -s .github/actions/verify-pytest-shards -p 'test_*.py' -v
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Suite structure
        run: |
          python -m pip install --quiet 'pyyaml==6.0.3'
          python .github/scripts/check_suite.py
      - name: Suite structure selftests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
