name: Reusable CodeQL

# Reusable CodeQL analysis workflow for homelabforge Python+React repos.
# Consumers wrap via .github/workflows/codeql.yml that calls this with
# the repo's per-repo settings (model packs, query exclusions).

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.14"
      bun-version-file:
        type: string
        default: ".bun-version"
      bun-version:
        type: string
        default: ""
      runner-os:
        type: string
        default: ubuntu-latest
      codeql-config-file:
        type: string
        default: ".github/codeql/codeql-config.yml"
      python-extension-pack:
        # E.g. "homelabforge/tidewatch-models" — set to enable extra
        # CodeQL extension packs for the python analysis.
        type: string
        default: ""

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ inputs.runner-os }}
    timeout-minutes: 360
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript' ]
        include:
          - language: python
            build-mode: none
          - language: javascript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: |
          cd backend
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e .
          fi

      - name: Set up Bun (from version-file)
        if: matrix.language == 'javascript' && inputs.bun-version == ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ${{ inputs.bun-version-file }}

      - name: Set up Bun (from explicit override)
        if: matrix.language == 'javascript' && inputs.bun-version != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install JS dependencies
        if: matrix.language == 'javascript'
        run: |
          cd frontend
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then bun install; else bun install --frozen-lockfile; fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          config-file: ${{ inputs.codeql-config-file }}
          source-root: ${{ matrix.language == 'python' && 'backend' || 'frontend' }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        env:
          # Inject extension packs for python only when consumer provides one.
          CODEQL_ACTION_EXTRA_OPTIONS: >-
            ${{ matrix.language == 'python' && inputs.python-extension-pack != '' && format(
              '{{"database":{{"run-queries":["--additional-packs={0}/.github/codeql","--extension-packs={1}"]}}}}',
              github.workspace,
              inputs.python-extension-pack
            ) || '{}' }}
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
          upload: true

      - name: Upload SARIF results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: codeql-results-${{ matrix.language }}
          path: sarif-results
          retention-days: 30
