name: Self Auto-Merge

# Self-hosted dogfooding: this repo consumes its own reusable auto-merge
# workflow so dependabot PRs against shared-workflows itself merge without
# manual review.
#
# Calls the reusable by LOCAL path (./), not the full owner/repo@main path.
# A full same-repo reusable reference startup-fails on pull_request events;
# the local path resolves to the same commit as this caller, so it never
# lags itself, and is GitHub's documented pattern for same-repo reusables.
# (External consumers still MUST pin a released tag — that rule is for them.)
#
# Distinct filename from the reusable workflow (dependabot-auto-merge.yml)
# to avoid name collision with the file consumers call by path.

on:
  pull_request:

# The repo's default workflow token is read-only, so this caller must
# explicitly grant the write scopes the reusable's job requests — otherwise
# the run startup-fails ("requesting contents: write... but only allowed
# contents: read"). Fork PRs still get a read-only token regardless (the
# event is pull_request, not pull_request_target).
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: ./.github/workflows/dependabot-auto-merge.yml
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
